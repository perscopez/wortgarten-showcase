<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">Weiterbildung — özgün eğitsel görsel çağrışım</title><desc id="desc">Eğitsel çağrışım şeması: ayrı Lucide sembolleri kelimenin anlamını çağrıştırır; literal bir sahne veya eylem iddiası değildir. Bu çağrışım şeması şu durumu hatırlatmak içindir: Çalışan akşam dersinde açık kitaba bakarken beceri basamakları yükseliyor.</desc><rect width="920" height="640" rx="32" fill="#f7f4ec"/><text x="460" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334f57">EĞİTİMSEL ÇAĞRIŞIM ŞEMASI</text><circle cx="120" cy="112" r="64" fill="#fff" opacity=".5"/><circle cx="800" cy="520" r="92" fill="#fff" opacity=".46"/><rect x="40" y="72" width="840" height="450" rx="28" fill="#fffdf8" stroke="#e4e6da" stroke-width="3"/><path d="M72 118h776" stroke="#e8ece4" stroke-width="3"/><svg x="95" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="worker"><g fill="none" stroke="#7661a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></g></svg><svg x="355" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="open-book"><g fill="none" stroke="#efbb5d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"></path><path d="m16 12 2 2 4-4"></path><path d="M22 6V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2h4.001A2 2 0 0022 17v-1.344"></path></g></svg><svg x="615" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="stairs"><path d="M3 21h5v-5h5v-5h5V6h3" fill="none" stroke="#43a39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><g transform="translate(410 588)"><rect x="-132" y="0" width="264" height="30" rx="15" fill="#7661a