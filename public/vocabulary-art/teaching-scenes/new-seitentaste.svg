<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">Seitentaste — özgün eğitsel görsel çağrışım</title><desc id="desc">Eğitsel çağrışım şeması: ayrı Lucide sembolleri kelimenin anlamını çağrıştırır; literal bir sahne veya eylem iddiası değildir. Bu çağrışım şeması şu bağlamı hatırlatmak içindir: Telefon silüetinin sağ kenarındaki fiziksel yan düğme kırmızıyla vurgulanıyor; büyütme simgesi ayrıntıya dikkat çekiyor.</desc><rect width="920" height="640" rx="32" fill="#f7f4ec"/><text x="460" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334f57">EĞİTİMSEL ÇAĞRIŞIM ŞEMASI</text><circle cx="120" cy="112" r="64" fill="#fff" opacity=".5"/><circle cx="800" cy="520" r="92" fill="#fff" opacity=".46"/><rect x="40" y="72" width="840" height="450" rx="28" fill="#fffdf8" stroke="#e4e6da" stroke-width="3"/><path d="M72 118h776" stroke="#e8ece4" stroke-width="3"/><svg x="225" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="phone with highlighted right-side button"><g fill="none" stroke="#38678a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="1.5" width="14" height="21" rx="2.5"/><path d="M10 4h4M10 20h4"/><path d="M19 7h1.5v4H19" fill="#dc7355" stroke="#dc7355"/><path d="M20.5 9H23" stroke="#dc7355" stroke-dasharray="1 1"/><circle cx="23" cy="9" r="1" fill="#dc7355"/></g></svg><svg x="485" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="button-detail"><g fill="none" stroke="#f2b960" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line><line x1="11" x2="11" y1="8" y2="14"></line><line x1="8" x2="14" y1="11" y2="11"></line></g></svg><g transform="translate(410 588)"><rect x="-132" y="0" width="264" height="30" rx="15" fill="#235d53" opacity=".11"/><circle cx="-92" cy="15" r="6" fill="#f2b960"/><circle cx="-68" cy="15" r="6" fill="#dc7355"/><circle cx="-44" cy="15" r="6" fill="#235d53"/><path d="M-10 15h100" stroke="#b7c4bb" stroke-width="4" stroke-linecap="round"/></g></svg>
