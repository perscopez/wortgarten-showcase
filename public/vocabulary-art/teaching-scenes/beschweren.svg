<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">beschweren — özgün eğitsel görsel çağrışım</title><desc id="desc">Eğitsel çağrışım şeması: ayrı Lucide sembolleri kelimenin anlamını çağrıştırır; literal bir sahne veya eylem iddiası değildir. Bu çağrışım şeması şu durumu hatırlatmak içindir: İki görsel çağrışım: müşteri şikâyet iletiyor; ağırlık bir kâğıdı bastırıyor.</desc><rect width="920" height="640" rx="32" fill="#f7f4ec"/><text x="460" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334f57">EĞİTİMSEL ÇAĞRIŞIM ŞEMASI</text><circle cx="120" cy="112" r="64" fill="#fff" opacity=".5"/><circle cx="800" cy="520" r="92" fill="#fff" opacity=".46"/><rect x="40" y="72" width="840" height="450" rx="28" fill="#fffdf8" stroke="#e4e6da" stroke-width="3"/><path d="M72 118h776" stroke="#e8ece4" stroke-width="3"/><svg x="25" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="customer"><g fill="none" stroke="#38678a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></g></svg><svg x="245" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="complaint-bubble"><g fill="none" stroke="#f4bb58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></g></svg><svg x="465" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="paperweight"><g fill="none" stroke="#d97565" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 7l1 14h10l1-14M9 4h6v3"/><path d="M4 18h16"/></g></svg><svg x="685" y="160" width="210" height="210" viewBox="0 0 24 24" role="img