<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">anstehen — özgün eğitsel görsel çağrışım</title><desc id="desc">Eğitsel çağrışım şeması: ayrı Lucide sembolleri kelimenin anlamını çağrıştırır; literal bir sahne veya eylem iddiası değildir. Bu çağrışım şeması şu bağlamı hatırlatmak içindir: Sırada bekleme anlamı seçildi: kişiler sıra çizgisinde bekliyor.</desc><rect width="920" height="640" rx="32" fill="#f7f4ec"/><text x="460" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334f57">LERNSCHEMA · BILDASSOZIATION</text><circle cx="120" cy="112" r="64" fill="#fff" opacity=".5"/><circle cx="800" cy="520" r="92" fill="#fff" opacity=".46"/><rect x="40" y="72" width="840" height="450" rx="28" fill="#fffdf8" stroke="#e4e6da" stroke-width="3"/><path d="M72 118h776" stroke="#e8ece4" stroke-width="3"/><svg x="95" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="queue-line"><g fill="none" stroke="#235d53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"></path><circle cx="10" cy="8" r="5"></circle><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path></g></svg><svg x="355" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="person"><g fill="none" stroke="#f2b960" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"></circle><path d="m9 20 3-6 3 6"></path><path d="m6 8 6 2 6-2"></path><path d="M12 10v4"></path></g></svg><svg x="615" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="sequence-dots"><g fill="none" stroke="#dc7355" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"></path><path d="M11 12h10"></path><path d="M11 19h10"></path><path d="M4 4h1v5"></path><path d="M4 9h2"></path><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5