<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">halten — özgün eğitsel görsel çağrışım</title><desc id="desc">Eğitsel çağrışım şeması: ayrı Lucide sembolleri kelimenin anlamını çağrıştırır; literal bir sahne veya eylem iddiası değildir. Bu çağrışım şeması şu durumu hatırlatmak içindir: El nesneyi tutuyor; düşünce balonu aynı nesne hakkındaki kanaati gösteriyor.</desc><rect width="920" height="640" rx="32" fill="#f7f4ec"/><text x="460" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334f57">LERNSCHEMA · BILDASSOZIATION</text><circle cx="120" cy="112" r="64" fill="#fff" opacity=".5"/><circle cx="800" cy="520" r="92" fill="#fff" opacity=".46"/><rect x="40" y="72" width="840" height="450" rx="28" fill="#fffdf8" stroke="#e4e6da" stroke-width="3"/><path d="M72 118h776" stroke="#e8ece4" stroke-width="3"/><svg x="95" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="hand"><g fill="none" stroke="#7661a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"></path><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></g></svg><svg x="355" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="object"><g fill="none" stroke="#efbb5d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></g></svg><svg x="615" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="thought-bubble"><g fill="none" stroke="#43a39a" stroke-width="2.5