<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">spazieren — özgün eğitsel görsel çağrışım</title><desc id="desc">Eğitsel çağrışım şeması: ayrı Lucide sembolleri kelimenin anlamını çağrıştırır; literal bir sahne veya eylem iddiası değildir. Bu çağrışım şeması şu durumu hatırlatmak içindir: İki kişi park yolunda yürürken ağaçlar ve bank rotayı belirliyor.</desc><rect width="920" height="640" rx="32" fill="#f7f4ec"/><text x="460" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334f57">LERNSCHEMA · BILDASSOZIATION</text><circle cx="120" cy="112" r="64" fill="#fff" opacity=".5"/><circle cx="800" cy="520" r="92" fill="#fff" opacity=".46"/><rect x="40" y="72" width="840" height="450" rx="28" fill="#fffdf8" stroke="#e4e6da" stroke-width="3"/><path d="M72 118h776" stroke="#e8ece4" stroke-width="3"/><svg x="95" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="two-people"><g fill="none" stroke="#7661a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"></path><circle cx="10" cy="8" r="5"></circle><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path></g></svg><svg x="355" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="park-path"><g fill="none" stroke="#efbb5d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"></path><path d="M7 16v6"></path><path d="M13 19v3"></path><path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5"></path></g></svg><svg x="615" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="trees"><g fill="none" stroke="#43a39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0