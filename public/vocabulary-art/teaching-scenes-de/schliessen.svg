<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">schließen — özgün eğitsel görsel çağrışım</title><desc id="desc">Eğitsel çağrışım şeması: ayrı Lucide sembolleri kelimenin anlamını çağrıştırır; literal bir sahne veya eylem iddiası değildir. Bu çağrışım şeması şu durumu hatırlatmak içindir: Açık kapının kapanmasını hatırlatan sembolik bir kapı ve yön işareti.</desc><rect width="920" height="640" rx="32" fill="#f7f4ec"/><text x="460" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334f57">LERNSCHEMA · BILDASSOZIATION</text><circle cx="120" cy="112" r="64" fill="#fff" opacity=".5"/><circle cx="800" cy="520" r="92" fill="#fff" opacity=".46"/><rect x="40" y="72" width="840" height="450" rx="28" fill="#fffdf8" stroke="#e4e6da" stroke-width="3"/><path d="M72 118h776" stroke="#e8ece4" stroke-width="3"/><svg x="95" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="hand"><g fill="none" stroke="#38678a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"></path><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></g></svg><svg x="355" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="door"><g fill="none" stroke="#f4bb58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h.01"></path><path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"></path><path d="M2 20h20"></path></g></svg><svg x="615" y="160" width="210" height="210" viewBox="0 0 24 24" role="img" aria-label="closing-arrow"><g fill="none" stroke="#d97565" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7